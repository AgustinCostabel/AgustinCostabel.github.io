<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Archlight — Game Developer</title>

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="hero">
    <img src="assets/logo.png" alt="Archlight Logo" class="logo" />
    <h1>Archlight</h1>
    <p class="subtitle">Indie Game Developer</p>
  </header>

  <main>
    <section class="about">
      <p>
        I create mysterious, atmospheric games with a focus on mood,
        narrative, and player curiosity.
      </p>
    </section>

    <section class="projects">
      <h2>Proyectos</h2>

      <div class="project-grid">

        <a class="project-card" href="#" target="_blank" rel="noopener">
          <img src="assets/project-unity.svg" alt="Captura del proyecto hecho en Unity" loading="lazy">
          <span class="project-title">Nombre del juego</span>
          <span class="project-engine">Unity</span>
        </a>

        <a class="project-card" href="#" target="_blank" rel="noopener">
          <img src="assets/project-godot.svg" alt="Captura del proyecto hecho en Godot" loading="lazy">
          <span class="project-title">Nombre del juego</span>
          <span class="project-engine">Godot</span>
        </a>

        <a class="project-card" href="#" target="_blank" rel="noopener">
          <img src="assets/project-cocos.svg" alt="Captura del proyecto hecho en Cocos Dashboard" loading="lazy">
          <span class="project-title">Nombre del juego</span>
          <span class="project-engine">Cocos Dashboard</span>
        </a>

      </div>
    </section>
  </main>

  <footer>
    <p>© Archlight</p>
  </footer>

</body>
</html>
